<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1DB954">
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="spotify_clone.png">
    <!-- Windows Support -->
    <meta name="msapplication-TileColor" content="#1DB954">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #121212;
            --surface: #181818;
            --surface-low: #282828;
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --sidebar-width: 240px;
            --player-height: 90px;
            --header-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-areas:
                "sidebar main"
                "player player";
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 1fr var(--player-height);
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background-color: black;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .logo {
            padding: 0 12px;
            margin-bottom: 18px;
        }

        .logo svg {
            fill: var(--text-primary);
            width: 131px;
            height: 40px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 12px;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 0;
        }

        .nav-menu a:hover {
            color: var(--text-primary);
        }

        .nav-menu a.active {
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            grid-area: main;
            background: linear-gradient(180deg, #404040 0%, var(--background) 100%);
            overflow-y: auto;
            position: relative;
        }

        .header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: var(--header-height);
        }

        .search-bar {
            background-color: var(--surface);
            border-radius: 500px;
            padding: 6px 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 364px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        /* Player Bar */
        .player-bar {
            grid-area: player;
            background-color: var(--surface);
            border-top: 1px solid #282828;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .play-button {
            background-color: var(--text-primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .play-button:hover {
            transform: scale(1.04);
        }

        /* Content Grid */
        .content-grid {
            padding: 24px 32px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .grid-card {
            background-color: var(--surface);
            padding: 16px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .grid-card:hover {
            background-color: var(--surface-low);
        }

        .grid-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .grid-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .grid-card p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            :root {
                --player-height-mobile: 140px;
            }

            .player-bar {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 100;
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
                padding: 8px 0;
                background-color: var(--surface);
                border-top: 1px solid var(--surface-low);
            }

            .player-controls {
                justify-content: center;
                gap: 24px;
                margin: 8px 0;
            }

            .now-playing {
                justify-content: center;
                padding: 0 8px;
                font-size: 13px;
                min-height: 56px;
                display: flex;
                align-items: center;
            }

            .volume-controls {
                display: none;
            }

            .play-button, .next-button, .back-button, .grid-card {
                min-height: 48px;
                min-width: 48px;
            }

            .app-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "main"
                    "player";
            }

            .sidebar {
                display: none;
            }

            .search-bar {
                width: 100%;
                max-width: 364px;
            }

            .main-content {
                grid-area: main;
                background: linear-gradient(180deg, #404040 0%, var(--background) 100%);
                overflow-y: auto;
                position: relative;
                padding-bottom: var(--player-height-mobile);
            }
        }

        body, .app-container {
            overflow-x: hidden;
        }
    </style>
    <script>
        // Audius API Integration
        class AudioVisualizer {
            static instance = null;

            static getInstance() {
                if (!AudioVisualizer.instance) {
                    AudioVisualizer.instance = new AudioVisualizer();
                }
                return AudioVisualizer.instance;
            }

            constructor() {
                // Wait for DOM to be ready
                document.addEventListener('DOMContentLoaded', () => {
                    this.container = document.getElementById('visualizer-container');
                    this.canvas = document.getElementById('visualizer-canvas');
                    this.ctx = this.canvas.getContext('2d');
                    this.audioContext = null;
                    this.analyser = null;
                    this.source = null;
                    this.animationId = null;
                    this.mode = 'bars';
                    this.isActive = false;
                    this.colorPalette = ['#1DB954', '#1ed760', '#169c46'];
                    this.particles = [];
                    this.setupCanvas();
                    this.setupEventListeners();
                    console.log('AudioVisualizer initialized');
                });
            }

            setupCanvas() {
                if (!this.canvas) {
                    console.error('Canvas not found');
                    return;
                }
                const updateCanvasSize = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', updateCanvasSize);
                updateCanvasSize();
            }

            setupEventListeners() {
                if (!this.container || !this.canvas) {
                    console.error('Cannot setup event listeners - elements not found');
                    return;
                }

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'v') this.toggle();
                    if (e.key === 'Escape' && this.isActive) this.hide();
                });

                const controls = document.createElement('div');
                controls.className = 'visualizer-controls';
                controls.innerHTML = `
                    <button class="visualizer-button" data-mode="bars">Bars</button>
                    <button class="visualizer-button" data-mode="circles">Circles</button>
                    <button class="visualizer-button" data-mode="particles">Particles</button>
                    <button class="visualizer-button" data-action="close">Close</button>
                `;

                controls.querySelectorAll('.visualizer-button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mode = btn.dataset.mode;
                        if (mode) {
                            this.mode = mode;
                        } else if (btn.dataset.action === 'close') {
                            this.hide();
                        }
                    });
                });

                this.container.appendChild(controls);
            }

            async connect(audioElement) {
                try {
                    if (!this.canvas || !this.ctx) {
                        console.error('Canvas not initialized');
                        return;
                    }

                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    if (this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }

                    if (this.source) {
                        try {
                            this.source.disconnect();
                        } catch (e) {
                            console.log('Previous source already disconnected');
                        }
                    }

                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.source = this.audioContext.createMediaElementSource(audioElement);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    console.log('Audio context connected successfully');
                    this.ctx = await this.audioContext.createGain();
                    this.isAudioConnected = true;
                    console.log('Audio listeners setup complete');
                } catch (error) {
                    console.error('Error connecting audio context:', error);
                }
            }

            draw() {
                if (!this.isActive || !this.canvas || !this.ctx || !this.analyser) {
                    return;
                }

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const bufferLength = this.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                this.analyser.getByteFrequencyData(dataArray);

                switch (this.mode) {
                    case 'bars':
                        const barWidth = this.canvas.width / bufferLength * 2;
                        let x = 0;

                        for (let i = 0; i < bufferLength; i++) {
                            const barHeight = (dataArray[i] / 255) * this.canvas.height / 2;
                            const color = this.colorPalette[i % this.colorPalette.length];
                            this.ctx.fillStyle = color;
                            this.ctx.fillRect(x, this.canvas.height / 2 - barHeight, barWidth, barHeight * 2);
                            x += barWidth + 1;
                        }
                        break;

                    case 'circles':
                        const centerX = this.canvas.width / 2;
                        const centerY = this.canvas.height / 2;

                        for (let i = 0; i < bufferLength; i += 4) {
                            const radius = (dataArray[i] / 255) * Math.min(this.canvas.width, this.canvas.height) / 4;
                            const color = this.colorPalette[i % this.colorPalette.length];

                            this.ctx.beginPath();
                            this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                            this.ctx.strokeStyle = color;
                            this.ctx.lineWidth = 2;
                            this.ctx.stroke();
                        }
                        break;

                    case 'particles':
                        this.createParticles(dataArray);
                        this.particles.forEach(particle => {
                            this.ctx.beginPath();
                            this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                            this.ctx.fillStyle = particle.color;
                            this.ctx.fill();
                        });
                        break;
                }

                this.animationId = requestAnimationFrame(() => this.draw());
            }

            createParticles(dataArray) {
                for (let i = 0; i < 3; i++) {
                    if (dataArray[i * 10] > 150) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            radius: Math.random() * 3 + 2,
                            color: this.colorPalette[i % this.colorPalette.length],
                            velocity: {
                                x: (Math.random() - 0.5) * 3,
                                y: (Math.random() - 0.5) * 3
                            }
                        });
                    }
                }

                this.particles = this.particles.filter(p => {
                    p.x += p.velocity.x;
                    p.y += p.velocity.y;
                    p.radius *= 0.99;
                    return p.radius > 0.1;
                });
            }

            toggle() {
                if (this.isActive) {
                    this.hide();
                } else {
                    this.show();
                }
            }

            show() {
                if (!this.container || !this.canvas) {
                    console.error('Visualizer elements not found');
                    return;
                }
                this.container.style.display = 'block';
                this.isActive = true;
                this.draw();
            }

            hide() {
                if (!this.container) return;
                this.container.style.display = 'none';
                this.isActive = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }

        class AudiusAPI {
            static APP_NAME = 'SpotifyClone';
            static APP_VERSION = '1.0.0';
            constructor() {
                this.host = null;
                this.audio = new Audio();
                this.currentTrack = null;
                this.visualizer = null;
                this.isAudioConnected = false;
                this.trackList = [];
                this.currentTrackIndex = -1;

                // Initialize after DOM is ready
                document.addEventListener('DOMContentLoaded', () => {
                    this.visualizer = AudioVisualizer.getInstance();
                });
            }

            async init() {
                // Initialize audio context on user interaction
                document.addEventListener('click', () => {
                    if (this.visualizer && !this.visualizer.audioContext) {
                        this.visualizer.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                }, { once: true });
                try {
                    const response = await fetch('https://api.audius.co');
                    const { data } = await response.json();
                    this.host = data[0];
                    await this.setupAudioListeners();
                    return true;
                } catch (error) {
                    console.error('Failed to initialize Audius API:', error);
                    return false;
                }
            }

            async setupAudioListeners() {
                try {
                    if (!this.visualizer) {
                        this.visualizer = AudioVisualizer.getInstance();
                    }

                    if (!this.isAudioConnected) {
                        await this.visualizer.connect(this.audio);
                        this.isAudioConnected = true;
                    }

                    this.audio.addEventListener('play', () => this.updatePlayButton(true));
                    this.audio.addEventListener('pause', () => this.updatePlayButton(false));
                    this.audio.addEventListener('ended', () => {
                        this.updatePlayButton(false);
                        // Auto-advance to next track if available
                        if (this.trackList && typeof this.currentTrackIndex === 'number') {
                            if (this.currentTrackIndex < this.trackList.length - 1) {
                                this.playNext();
                            }
                        }
                    });
                    this.audio.addEventListener('error', (e) => {
                        console.error('Audio playback error:', e);
                        alert('Failed to play track. Please try another one.');
                        this.updatePlayButton(false);
                    });
                    console.log('Audio listeners setup complete');
                } catch (error) {
                    console.error('Error setting up audio listeners:', error);
                }
            }

            updatePlayButton(isPlaying) {
                const playButton = document.querySelector('.play-button');
                playButton.innerHTML = isPlaying
                    // Pause icon SVG
                    ? `<svg role="img" height="16" width="16" viewBox="0 0 16 16">
                            <rect x="3" y="2" width="4" height="12" rx="1" fill="currentColor"></rect>
                            <rect x="9" y="2" width="4" height="12" rx="1" fill="currentColor"></rect>
                       </svg>`
                    // Play icon SVG
                    : `<svg role="img" height="16" width="16" viewBox="0 0 16 16">
                            <path fill="currentColor" d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path>
                       </svg>`;
                playButton.setAttribute('data-playing', isPlaying);
            }

            async search(query, limit = 20) {
                try {
                    const response = await fetch(
                        `${this.host}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=${limit}`
                    );
                    const { data } = await response.json();
                    return data || [];
                } catch (error) {
                    console.error('Search failed:', error);
                    return [];
                }
            }

            async getTrending(limit = 20) {
                try {
                    const response = await fetch(
                        `${this.host}/v1/tracks/trending?limit=${limit}`
                    );
                    const { data } = await response.json();
                    return data || [];
                } catch (error) {
                    console.error('Failed to get trending tracks:', error);
                    return [];
                }
            }

            getStreamUrl(trackId) {
                return `${this.host}/v1/tracks/${trackId}/stream?app_name=${AudiusAPI.APP_NAME}&app_version=${AudiusAPI.APP_VERSION}`;
            }

            async play(track, queue = null, index = null) {
                try {
                    if (!this.visualizer || !this.visualizer.audioContext) {
                        await this.setupAudioListeners();
                    }

                    if (queue && Array.isArray(queue)) {
                        this.trackList = queue;
                    }
                    if (typeof index === 'number') {
                        this.currentTrackIndex = index;
                    } else {
                        // If track is in queue, set index
                        if (this.trackList && Array.isArray(this.trackList)) {
                            const idx = this.trackList.findIndex(t => t.id === track.id);
                            if (idx !== -1) this.currentTrackIndex = idx;
                        }
                    }

                    if (this.currentTrack?.id === track.id) {
                        if (this.audio.paused) {
                            await this.audio.play();
                        } else {
                            this.audio.pause();
                        }
                        return;
                    }

                    this.currentTrack = track;
                    this.audio.src = this.getStreamUrl(track.id);
                    await this.audio.play();
                    await this.updateNowPlaying(track);
                    console.log('Playing track:', track.title);
                } catch (error) {
                    console.error('Error playing track:', error);
                    alert('Failed to play track. Please try again.');
                }
            }

            playTrackByIndex(index) {
                if (!this.trackList.length || index < 0 || index >= this.trackList.length) return;
                this.currentTrackIndex = index;
                const track = this.trackList[index];
                this.play(track, this.trackList, index);
            }

            playNext() {
                if (!this.trackList.length) return;
                let nextIdx = this.currentTrackIndex + 1;
                if (nextIdx >= this.trackList.length) return; // Or loop: nextIdx = 0;
                this.playTrackByIndex(nextIdx);
            }

            playPrevious() {
                if (!this.trackList.length) return;
                let prevIdx = this.currentTrackIndex - 1;
                if (prevIdx < 0) return; // Or loop: prevIdx = this.trackList.length - 1;
                this.playTrackByIndex(prevIdx);
            }

            updateNowPlaying(track) {
                const nowPlaying = document.querySelector('.now-playing');
                const artworkUrl = track.artwork?.['150x150'] || 'https://i.imgur.com/ZzHmDan.png';
                nowPlaying.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <img src="${artworkUrl}" alt="${track.title}" style="width: 56px; height: 56px; border-radius: 4px;">
                        <div style="margin-left: 12px;">
                            <div style="font-size: 14px;">${track.title}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${track.user.name}</div>
                        </div>
                    </div>
                `;
            }
        }

        // UI Handler
        class SpotifyCloneUI {
            constructor(audius) {
                this.audius = audius;
                this.contentGrid = document.querySelector('.content-grid');
                this.searchInput = document.querySelector('.search-bar input');
                this.searchTimeout = null;
                this.currentTracks = [];
            }

            init() {
                this.setupEventListeners();
                this.loadTrendingTracks();
            }

            setupEventListeners() {
                this.searchInput.addEventListener('input', (e) => {
                    clearTimeout(this.searchTimeout);
                    this.searchTimeout = setTimeout(() => {
                        this.handleSearch(e.target.value);
                    }, 500);
                });

                document.querySelector('.play-button').addEventListener('click', () => {
                    if (this.audius.currentTrack) {
                        this.audius.play(this.audius.currentTrack);
                    }
                });

                document.querySelector('.next-button').addEventListener('click', () => {
                    this.audius.playNext();
                });
                document.querySelector('.back-button').addEventListener('click', () => {
                    this.audius.playPrevious();
                });
            }

            async handleSearch(query) {
                if (!query.trim()) {
                    this.loadTrendingTracks();
                    return;
                }

                const tracks = await this.audius.search(query);
                this.renderTracks(tracks);
            }

            async loadTrendingTracks() {
                const tracks = await this.audius.getTrending();
                this.renderTracks(tracks);
            }

            renderTracks(tracks) {
                if (!tracks.length) {
                    this.contentGrid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                            <h2>No tracks found</h2>
                            <p style="color: var(--text-secondary);">Try searching for something else</p>
                        </div>
                    `;
                    return;
                }
                // Store queue for playback navigation
                this.audius.trackList = tracks;
                this.audius.currentTrackIndex = -1;

                this.contentGrid.innerHTML = tracks.map((track, idx) => {
                    const artworkUrl = track.artwork?.['480x480'] || 'https://i.imgur.com/ZzHmDan.png';
                    // Use data-index for event delegation
                    return `
                        <div class="grid-card" data-track-index="${idx}">
                            <img src="${artworkUrl}" alt="${track.title}">
                            <h3>${track.title}</h3>
                            <p>${track.user.name}</p>
                        </div>
                    `;
                }).join('');

                // Add click listeners for each card
                this.contentGrid.querySelectorAll('.grid-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        const idx = parseInt(card.getAttribute('data-track-index'));
                        if (!isNaN(idx)) {
                            this.audius.play(this.audius.trackList[idx], this.audius.trackList, idx);
                        }
                    });
                });
            }
        }

        // Initialize application
        let app;
        async function initApp() {
            const audius = new AudiusAPI();
            const initialized = await audius.init();
            
            if (initialized) {
                app = new SpotifyCloneUI(audius);
                app.init();
            } else {
                alert('Failed to initialize Audius API. Please try again later.');
            }
        }

        // Start the app when the page loads
        window.addEventListener('load', initApp);
    </script>
</head>
<body>
    <div id="visualizer-container" style="display: none;">
        <canvas id="visualizer-canvas"></canvas>
    </div>
    <div class="app-container">
