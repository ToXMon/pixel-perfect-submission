<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #121212;
            --surface: #181818;
            --surface-low: #282828;
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --sidebar-width: 240px;
            --player-height: 90px;
            --header-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-areas:
                "sidebar main"
                "player player";
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 1fr var(--player-height);
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background-color: black;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .logo {
            padding: 0 12px;
            margin-bottom: 18px;
        }

        .logo svg {
            fill: var(--text-primary);
            width: 131px;
            height: 40px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 12px;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 0;
        }

        .nav-menu a:hover {
            color: var(--text-primary);
        }

        .nav-menu a.active {
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            grid-area: main;
            background: linear-gradient(180deg, #404040 0%, var(--background) 100%);
            overflow-y: auto;
            position: relative;
        }

        .header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: var(--header-height);
        }

        .search-bar {
            background-color: var(--surface);
            border-radius: 500px;
            padding: 6px 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 364px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        /* Player Bar */
        .player-bar {
            grid-area: player;
            background-color: var(--surface);
            border-top: 1px solid #282828;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .play-button {
            background-color: var(--text-primary);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .play-button:hover {
            transform: scale(1.04);
        }

        /* Content Grid */
        .content-grid {
            padding: 24px 32px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .grid-card {
            background-color: var(--surface);
            padding: 16px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .grid-card:hover {
            background-color: var(--surface-low);
        }

        .grid-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .grid-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .grid-card p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "main"
                    "player";
            }

            .sidebar {
                display: none;
            }

            .search-bar {
                width: 100%;
                max-width: 364px;
            }
        }

        /* Visualizer Styles */
        #visualizer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
        }

        #visualizer-canvas {
            width: 100%;
            height: 100%;
        }

        .visualizer-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 1001;
        }

        .visualizer-button {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .visualizer-button:hover {
            background: var(--primary);
            color: black;
            transform: scale(1.05);
        }
    </style>
    <script>
        // Machine Learning Engine for Music Discovery
        class MusicMLEngine {
            constructor() {
                this.listeningHistory = this.loadHistory();
                this.userProfile = this.loadUserProfile();
                this.genreWeights = {};
                this.trackFeatures = new Map();
                this.similarityCache = new Map();
            }

            loadHistory() {
                try {
                    return JSON.parse(localStorage.getItem('listeningHistory') || '[]');
                } catch {
                    return [];
                }
            }

            loadUserProfile() {
                try {
                    return JSON.parse(localStorage.getItem('userProfile') || '{}');
                } catch {
                    return {};
                }
            }

            saveHistory() {
                localStorage.setItem('listeningHistory', JSON.stringify(this.listeningHistory.slice(-100)));
            }

            saveUserProfile() {
                localStorage.setItem('userProfile', JSON.stringify(this.userProfile));
            }

            // Record user interaction for learning
            recordPlay(track) {
                this.listeningHistory.push({
                    trackId: track.id,
                    title: track.title,
                    artist: track.user.name,
                    genre: track.genre,
                    mood: track.mood,
                    timestamp: Date.now()
                });
                this.updateUserProfile(track);
                this.saveHistory();
                this.saveUserProfile();
            }

            // Build user preference profile
            updateUserProfile(track) {
                if (!this.userProfile.genres) this.userProfile.genres = {};
                if (!this.userProfile.artists) this.userProfile.artists = {};
                if (!this.userProfile.moods) this.userProfile.moods = {};

                // Update genre preferences
                const genre = track.genre || 'Unknown';
                this.userProfile.genres[genre] = (this.userProfile.genres[genre] || 0) + 1;

                // Update artist preferences
                const artist = track.user.name;
                this.userProfile.artists[artist] = (this.userProfile.artists[artist] || 0) + 1;

                // Update mood preferences
                const mood = track.mood || 'Unknown';
                this.userProfile.moods[mood] = (this.userProfile.moods[mood] || 0) + 1;
            }

            // TF-IDF based semantic search
            calculateTFIDF(query, track) {
                const queryTerms = this.tokenize(query.toLowerCase());
                const trackText = `${track.title} ${track.user.name} ${track.genre || ''} ${track.mood || ''}`.toLowerCase();
                const trackTerms = this.tokenize(trackText);

                if (queryTerms.length === 0 || trackTerms.length === 0) return 0;

                // Calculate term frequency
                const tf = {};
                trackTerms.forEach(term => {
                    tf[term] = (tf[term] || 0) + 1;
                });

                // Calculate normalized term frequency score
                // Note: This is a simplified TF approach without IDF weighting
                let score = 0;
                queryTerms.forEach(term => {
                    if (tf[term]) {
                        score += tf[term] / trackTerms.length;
                    }
                });

                return score;
            }

            tokenize(text) {
                return text.split(/\s+/).filter(t => t.length > 0);
            }

            // Content-based filtering using track metadata
            calculateContentSimilarity(track1, track2) {
                const cacheKey = `${track1.id}-${track2.id}`;
                if (this.similarityCache.has(cacheKey)) {
                    return this.similarityCache.get(cacheKey);
                }

                let similarity = 0;

                // Genre similarity
                if (track1.genre && track2.genre && track1.genre === track2.genre) {
                    similarity += 0.3;
                }

                // Mood similarity
                if (track1.mood && track2.mood && track1.mood === track2.mood) {
                    similarity += 0.2;
                }

                // Artist similarity
                if (track1.user.id === track2.user.id) {
                    similarity += 0.25;
                }

                // Title similarity (using Jaccard similarity)
                const title1Words = new Set(this.tokenize(track1.title.toLowerCase()));
                const title2Words = new Set(this.tokenize(track2.title.toLowerCase()));
                const intersection = new Set([...title1Words].filter(x => title2Words.has(x)));
                const union = new Set([...title1Words, ...title2Words]);
                if (union.size > 0) {
                    similarity += 0.25 * (intersection.size / union.size);
                }

                this.similarityCache.set(cacheKey, similarity);
                return similarity;
            }

            // Collaborative filtering based on listening patterns
            getPersonalizedRecommendations(tracks, limit = 10) {
                if (!tracks || tracks.length === 0) return [];
                if (this.listeningHistory.length === 0) {
                    // Cold start: return trending tracks
                    return tracks.slice(0, limit);
                }

                // Score each track based on user preferences
                const scoredTracks = tracks.map(track => {
                    let score = 0;

                    // Genre preference
                    const genre = track.genre || 'Unknown';
                    if (this.userProfile.genres && this.userProfile.genres[genre]) {
                        score += this.userProfile.genres[genre] * 0.4;
                    }

                    // Artist preference
                    const artist = track.user.name;
                    if (this.userProfile.artists && this.userProfile.artists[artist]) {
                        score += this.userProfile.artists[artist] * 0.35;
                    }

                    // Mood preference
                    const mood = track.mood || 'Unknown';
                    if (this.userProfile.moods && this.userProfile.moods[mood]) {
                        score += this.userProfile.moods[mood] * 0.25;
                    }

                    // Recency bonus
                    if (track.created_at) {
                        const daysOld = (Date.now() - new Date(track.created_at).getTime()) / (1000 * 60 * 60 * 24);
                        score += Math.max(0, 1 - daysOld / 365) * 0.1;
                    }

                    // Popularity factor
                    if (track.play_count) {
                        score += Math.log10(track.play_count + 1) * 0.05;
                    }

                    return { track, score };
                });

                // Sort by score and return top tracks
                return scoredTracks
                    .sort((a, b) => b.score - a.score)
                    .slice(0, limit)
                    .map(item => item.track);
            }

            // Find similar tracks using content-based filtering
            findSimilarTracks(sourceTrack, candidateTracks, limit = 5) {
                if (!candidateTracks || candidateTracks.length === 0) return [];

                const similarities = candidateTracks
                    .filter(track => track.id !== sourceTrack.id)
                    .map(track => ({
                        track,
                        similarity: this.calculateContentSimilarity(sourceTrack, track)
                    }))
                    .sort((a, b) => b.similarity - a.similarity)
                    .slice(0, limit);

                return similarities.map(item => item.track);
            }

            // Enhanced search with ML ranking
            rankSearchResults(query, tracks) {
                if (!tracks || tracks.length === 0) return [];

                const rankedTracks = tracks.map(track => {
                    // TF-IDF score
                    const tfidfScore = this.calculateTFIDF(query, track);

                    // Personalization score
                    let personalScore = 0;
                    if (this.listeningHistory.length > 0) {
                        const genre = track.genre || 'Unknown';
                        const artist = track.user.name;
                        personalScore += (this.userProfile.genres?.[genre] || 0) * 0.3;
                        personalScore += (this.userProfile.artists?.[artist] || 0) * 0.3;
                    }

                    // Popularity score
                    const popularityScore = track.play_count ? Math.log10(track.play_count + 1) / 10 : 0;

                    // Combined score
                    const finalScore = tfidfScore * 0.6 + personalScore * 0.3 + popularityScore * 0.1;

                    return { track, score: finalScore };
                });

                return rankedTracks
                    .sort((a, b) => b.score - a.score)
                    .map(item => item.track);
            }

            // Mood-based discovery
            discoverByMood(mood, tracks) {
                const moodKeywords = {
                    'energetic': ['upbeat', 'dance', 'electronic', 'edm', 'house', 'party'],
                    'chill': ['ambient', 'lofi', 'downtempo', 'chillout', 'relaxing'],
                    'focus': ['instrumental', 'classical', 'ambient', 'study'],
                    'workout': ['rock', 'metal', 'hip-hop', 'electronic', 'high-energy'],
                    'happy': ['pop', 'indie', 'upbeat', 'feel-good'],
                    'sad': ['acoustic', 'indie', 'emotional', 'ballad']
                };

                const keywords = moodKeywords[mood.toLowerCase()] || [];
                
                return tracks.filter(track => {
                    const trackText = `${track.title} ${track.genre || ''} ${track.mood || ''}`.toLowerCase();
                    return keywords.some(keyword => trackText.includes(keyword));
                }).slice(0, 20);
            }

            // Smart playlist generation
            generatePlaylist(seedTrack, allTracks, playlistSize = 15) {
                if (!allTracks || allTracks.length === 0) return [seedTrack];

                const playlist = [seedTrack];
                let candidates = [...allTracks].filter(t => t.id !== seedTrack.id);

                while (playlist.length < playlistSize && candidates.length > 0) {
                    // Find most similar track to the last added track
                    const lastTrack = playlist[playlist.length - 1];
                    const similarities = candidates.map(track => ({
                        track,
                        similarity: this.calculateContentSimilarity(lastTrack, track),
                        randomFactor: Math.random() * 0.3 - 0.15
                    }));

                    // Add randomness to each track independently to avoid repetitive playlists
                    similarities.sort((a, b) => {
                        return (b.similarity + b.randomFactor) - (a.similarity + a.randomFactor);
                    });

                    const nextTrack = similarities[0].track;
                    playlist.push(nextTrack);
                    candidates = candidates.filter(t => t.id !== nextTrack.id);
                }

                return playlist;
            }

            // Get listening statistics
            getStats() {
                const totalPlays = this.listeningHistory.length;
                const uniqueTracks = new Set(this.listeningHistory.map(h => h.trackId)).size;
                const topGenres = Object.entries(this.userProfile.genres || {})
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3)
                    .map(([genre]) => genre);
                const topArtists = Object.entries(this.userProfile.artists || {})
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 3)
                    .map(([artist]) => artist);

                return { totalPlays, uniqueTracks, topGenres, topArtists };
            }
        }

        // Audius API Integration
        class AudioVisualizer {
            static instance = null;

            static getInstance() {
                if (!AudioVisualizer.instance) {
                    AudioVisualizer.instance = new AudioVisualizer();
                }
                return AudioVisualizer.instance;
            }

            constructor() {
                // Wait for DOM to be ready
                document.addEventListener('DOMContentLoaded', () => {
                    this.container = document.getElementById('visualizer-container');
                    this.canvas = document.getElementById('visualizer-canvas');
                    this.ctx = this.canvas.getContext('2d');
                    this.audioContext = null;
                    this.analyser = null;
                    this.source = null;
                    this.animationId = null;
                    this.mode = 'bars';
                    this.isActive = false;
                    this.colorPalette = ['#1DB954', '#1ed760', '#169c46'];
                    this.particles = [];
                    this.setupCanvas();
                    this.setupEventListeners();
                    console.log('AudioVisualizer initialized');
                });
            }

            setupCanvas() {
                if (!this.canvas) {
                    console.error('Canvas not found');
                    return;
                }
                const updateCanvasSize = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', updateCanvasSize);
                updateCanvasSize();
            }

            setupEventListeners() {
                if (!this.container || !this.canvas) {
                    console.error('Cannot setup event listeners - elements not found');
                    return;
                }

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'v') this.toggle();
                    if (e.key === 'Escape' && this.isActive) this.hide();
                });

                const controls = document.createElement('div');
                controls.className = 'visualizer-controls';
                controls.innerHTML = `
                    <button class="visualizer-button" data-mode="bars">Bars</button>
                    <button class="visualizer-button" data-mode="circles">Circles</button>
                    <button class="visualizer-button" data-mode="particles">Particles</button>
                    <button class="visualizer-button" data-action="close">Close</button>
                `;

                controls.querySelectorAll('.visualizer-button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mode = btn.dataset.mode;
                        if (mode) {
                            this.mode = mode;
                        } else if (btn.dataset.action === 'close') {
                            this.hide();
                        }
                    });
                });

                this.container.appendChild(controls);
            }

            async connect(audioElement) {
                try {
                    if (!this.canvas || !this.ctx) {
                        console.error('Canvas not initialized');
                        return;
                    }

                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    if (this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }

                    if (this.source) {
                        try {
                            this.source.disconnect();
                        } catch (e) {
                            console.log('Previous source already disconnected');
                        }
                    }

                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 2048;
                    this.source = this.audioContext.createMediaElementSource(audioElement);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    console.log('Audio context connected successfully');
                    this.ctx = await this.audioContext.createGain();
                    this.isAudioConnected = true;
                    console.log('Audio listeners setup complete');
                } catch (error) {
                    console.error('Error connecting audio context:', error);
                }
            }

            draw() {
                if (!this.isActive || !this.canvas || !this.ctx || !this.analyser) {
                    return;
                }

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const bufferLength = this.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                this.analyser.getByteFrequencyData(dataArray);

                switch (this.mode) {
                    case 'bars':
                        const barWidth = this.canvas.width / bufferLength * 2;
                        let x = 0;

                        for (let i = 0; i < bufferLength; i++) {
                            const barHeight = (dataArray[i] / 255) * this.canvas.height / 2;
                            const color = this.colorPalette[i % this.colorPalette.length];
                            this.ctx.fillStyle = color;
                            this.ctx.fillRect(x, this.canvas.height / 2 - barHeight, barWidth, barHeight * 2);
                            x += barWidth + 1;
                        }
                        break;

                    case 'circles':
                        const centerX = this.canvas.width / 2;
                        const centerY = this.canvas.height / 2;

                        for (let i = 0; i < bufferLength; i += 4) {
                            const radius = (dataArray[i] / 255) * Math.min(this.canvas.width, this.canvas.height) / 4;
                            const color = this.colorPalette[i % this.colorPalette.length];

                            this.ctx.beginPath();
                            this.ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                            this.ctx.strokeStyle = color;
                            this.ctx.lineWidth = 2;
                            this.ctx.stroke();
                        }
                        break;

                    case 'particles':
                        this.createParticles(dataArray);
                        this.particles.forEach(particle => {
                            this.ctx.beginPath();
                            this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                            this.ctx.fillStyle = particle.color;
                            this.ctx.fill();
                        });
                        break;
                }

                this.animationId = requestAnimationFrame(() => this.draw());
            }

            createParticles(dataArray) {
                for (let i = 0; i < 3; i++) {
                    if (dataArray[i * 10] > 150) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            radius: Math.random() * 3 + 2,
                            color: this.colorPalette[i % this.colorPalette.length],
                            velocity: {
                                x: (Math.random() - 0.5) * 3,
                                y: (Math.random() - 0.5) * 3
                            }
                        });
                    }
                }

                this.particles = this.particles.filter(p => {
                    p.x += p.velocity.x;
                    p.y += p.velocity.y;
                    p.radius *= 0.99;
                    return p.radius > 0.1;
                });
            }

            toggle() {
                if (this.isActive) {
                    this.hide();
                } else {
                    this.show();
                }
            }

            show() {
                if (!this.container || !this.canvas) {
                    console.error('Visualizer elements not found');
                    return;
                }
                this.container.style.display = 'block';
                this.isActive = true;
                this.draw();
            }

            hide() {
                if (!this.container) return;
                this.container.style.display = 'none';
                this.isActive = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }

        class AudiusAPI {
            static APP_NAME = 'SpotifyClone';
            static APP_VERSION = '1.0.0';
            constructor() {
                this.host = null;
                this.audio = new Audio();
                this.currentTrack = null;
                this.visualizer = null;
                this.isAudioConnected = false;
                this.mlEngine = new MusicMLEngine();
                this.allTracks = [];

                // Initialize after DOM is ready
                document.addEventListener('DOMContentLoaded', () => {
                    this.visualizer = AudioVisualizer.getInstance();
                });
            }

            async init() {
                // Initialize audio context on user interaction
                document.addEventListener('click', () => {
                    if (this.visualizer && !this.visualizer.audioContext) {
                        this.visualizer.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                }, { once: true });
                try {
                    const response = await fetch('https://api.audius.co');
                    const { data } = await response.json();
                    this.host = data[0];
                    await this.setupAudioListeners();
                    return true;
                } catch (error) {
                    console.error('Failed to initialize Audius API:', error);
                    console.log('Running in demo mode with mock data');
                    // Set to a valid endpoint URL for potential future use
                    // In demo mode, API calls are intercepted and return mock data
                    this.host = 'https://discoveryprovider.audius.co';
                    this.useMockData = true;
                    await this.setupAudioListeners();
                    return true;
                }
            }

            getMockTracks() {
                return [
                    {
                        id: '1',
                        title: 'Electronic Dreams',
                        user: { id: 'u1', name: 'DJ Synthesis', handle: 'djsynthesis' },
                        genre: 'Electronic',
                        mood: 'Energetic',
                        play_count: 15420,
                        created_at: '2024-01-15T00:00:00Z',
                        artwork: { '150x150': 'https://via.placeholder.com/150/1DB954/FFFFFF?text=ED', '480x480': 'https://via.placeholder.com/480/1DB954/FFFFFF?text=Electronic' }
                    },
                    {

            async setupAudioListeners() {
                try {
                    if (!this.visualizer) {
                        this.visualizer = AudioVisualizer.getInstance();
                    }

                    if (!this.isAudioConnected) {
                        await this.visualizer.connect(this.audio);
                        this.isAudioConnected = true;
                    }

                    this.audio.addEventListener('play', () => this.updatePlayButton(true));
                    this.audio.addEventListener('pause', () => this.updatePlayButton(false));
                    this.audio.addEventListener('ended', () => this.updatePlayButton(false));
                    this.audio.addEventListener('error', (e) => {
                        console.error('Audio playback error:', e);
                        alert('Failed to play track. Please try another one.');
                        this.updatePlayButton(false);
                    });
                    console.log('Audio listeners setup complete');
                } catch (error) {
                    console.error('Error setting up audio listeners:', error);
                }
            }

            updatePlayButton(isPlaying) {
                const playButton = document.querySelector('.play-button');
                playButton.innerHTML = isPlaying ? 
                    '<svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path></svg>' :
                    '<svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path></svg>';
                playButton.setAttribute('data-playing', isPlaying);
            }

            async search(query, limit = 20) {
                try {
                    if (this.useMockData) {
                        const mockTracks = this.getMockTracks();
                        const filtered = mockTracks.filter(track => 
                            track.title.toLowerCase().includes(query.toLowerCase()) ||
                            track.user.name.toLowerCase().includes(query.toLowerCase()) ||
                            (track.genre && track.genre.toLowerCase().includes(query.toLowerCase()))
                        );
                        return this.mlEngine.rankSearchResults(query, filtered);
                    }
                    
                    const response = await fetch(
                        `${this.host}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=${limit}`
                    );
                    const { data } = await response.json();
                    
                    // Apply ML ranking to search results
                    const rankedResults = this.mlEngine.rankSearchResults(query, data || []);
                    return rankedResults;
                } catch (error) {
                    console.error('Search failed:', error);
                    return [];
                }
            }

            async getTrending(limit = 20) {
                try {
                    if (this.useMockData) {
                        this.allTracks = this.getMockTracks();
                        return this.allTracks;
                    }
                    
                    const response = await fetch(
                        `${this.host}/v1/tracks/trending?limit=${limit}`
                    );
                    const { data } = await response.json();
                    this.allTracks = data || [];
                    return data || [];
                } catch (error) {
                    console.error('Failed to get trending tracks:', error);
                    return [];
                }
            }

            async getRecommendations(limit = 20) {
                try {
                    if (this.useMockData) {
                        this.allTracks = this.getMockTracks();
                        const recommendations = this.mlEngine.getPersonalizedRecommendations(this.allTracks, limit);
                        return recommendations;
                    }
                    
                    // Get a larger pool of tracks for better recommendations
                    const response = await fetch(
                        `${this.host}/v1/tracks/trending?limit=100`
                    );
                    const { data } = await response.json();
                    this.allTracks = data || [];
                    
                    // Use ML engine to generate personalized recommendations
                    const recommendations = this.mlEngine.getPersonalizedRecommendations(data || [], limit);
                    return recommendations;
                } catch (error) {
                    console.error('Failed to get recommendations:', error);
                    return [];
                }
            }

            getSimilarTracks(track, limit = 5) {
                return this.mlEngine.findSimilarTracks(track, this.allTracks, limit);
            }

            discoverByMood(mood) {
                return this.mlEngine.discoverByMood(mood, this.allTracks);
            }

            generatePlaylist(seedTrack, size = 15) {
                return this.mlEngine.generatePlaylist(seedTrack, this.allTracks, size);
            }

            getStreamUrl(trackId) {
                return `${this.host}/v1/tracks/${trackId}/stream?app_name=${AudiusAPI.APP_NAME}&app_version=${AudiusAPI.APP_VERSION}`;
            }

            async play(track) {
                try {
                    if (!this.visualizer || !this.visualizer.audioContext) {
                        await this.setupAudioListeners();
                    }

                    if (this.currentTrack?.id === track.id) {
                        if (this.audio.paused) {
                            await this.audio.play();
                        } else {
                            this.audio.pause();
                        }
                        return;
                    }

                    this.currentTrack = track;
                    this.audio.src = this.getStreamUrl(track.id);
                    await this.audio.play();
                    await this.updateNowPlaying(track);
                    
                    // Record play for ML learning
                    this.mlEngine.recordPlay(track);
                    
                    console.log('Playing track:', track.title);
                } catch (error) {
                    console.error('Error playing track:', error);
                    alert('Failed to play track. Please try again.');
                }
            }

            updateNowPlaying(track) {
                const nowPlaying = document.querySelector('.now-playing');
                const artworkUrl = track.artwork?.['150x150'] || 'https://i.imgur.com/ZzHmDan.png';
                nowPlaying.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <img src="${artworkUrl}" alt="${track.title}" style="width: 56px; height: 56px; border-radius: 4px;">
                        <div style="margin-left: 12px;">
                            <div style="font-size: 14px;">${track.title}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${track.user.name}</div>
                        </div>
                    </div>
                `;
            }
        }

                this.contentGrid.querySelectorAll('.grid-card').forEach(card => {
                    const trackId = card.getAttribute('data-track-id');
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.similar-tracks-btn')) {
                            const track = window.trackDataMap.get(trackId);
                            if (track) this.audius.play(track);
                        }
                    });

                    // Show/hide similar tracks button on hover
                    card.addEventListener('mouseenter', () => {
                        const btn = card.querySelector('.similar-tracks-btn');
                        if (btn) btn.style.opacity = '1';
                    });
                    card.addEventListener('mouseleave', () => {
                        const btn = card.querySelector('.similar-tracks-btn');
                        if (btn) btn.style.opacity = '0';
                    });
                });

                // Add event listeners for similar tracks buttons
                this.contentGrid.querySelectorAll('.similar-tracks-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const trackId = btn.getAttribute('data-track-id');
                        const track = window.trackDataMap.get(trackId);
                        if (track) this.showSimilarTracks(track);
                    });
                });
            }

            escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .toString()
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            showSimilarTracks(track) {
                this.updateHeader(`Similar to "${this.escapeHtml(track.title)}"`);
                const similarTracks = this.audius.getSimilarTracks(track, 20);
                
                if (similarTracks.length === 0) {
                    this.contentGrid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                            <h2>No similar tracks found</h2>
                            <p style="color: var(--text-secondary);">Try exploring other tracks</p>
                        </div>
                    `;
                } else {
                    // Store seed track for playlist generation
                    if (!window.trackDataMap) {
                        window.trackDataMap = new Map();
                    }
                    window.trackDataMap.set('seed-track', track);
                    
                    // Add option to generate playlist
                    const headerDiv = document.createElement('div');
                    headerDiv.style.cssText = 'grid-column: 1/-1; margin-bottom: 16px; display: flex; gap: 12px;';
                    headerDiv.innerHTML = `
                        <button id="generate-playlist-btn"
                                style="background: var(--primary); color: black; border: none; 
                                       padding: 12px 24px; border-radius: 24px; font-weight: 700; 
                                       cursor: pointer; font-size: 14px;">
                            Generate Playlist
                        </button>
                    `;
                    this.contentGrid.innerHTML = '';
                    this.contentGrid.appendChild(headerDiv);
                    
                    // Add event listener for playlist generation
                    document.getElementById('generate-playlist-btn').addEventListener('click', () => {
                        const seedTrack = window.trackDataMap.get('seed-track');
                        if (seedTrack) this.generatePlaylistFromTrack(seedTrack);
                    });
                    
                    this.renderTracks(similarTracks);
                }
            }

            generatePlaylistFromTrack(seedTrack) {
                this.updateHeader(`Playlist from "${this.escapeHtml(seedTrack.title)}"`);
                const playlist = this.audius.generatePlaylist(seedTrack, 15);
                this.renderTracks(playlist);
            }
        }

        // Initialize application
        let app;
        async function initApp() {
            const audius = new AudiusAPI();
            const initialized = await audius.init();
            
            if (initialized) {
                const ui = new SpotifyCloneUI(audius);
                ui.init();
                app = { audius, ui };
            } else {
                alert('Failed to initialize Audius API. Please try again later.');
            }
        }

        // Start the app when the page loads
        window.addEventListener('load', initApp);
    </script>
